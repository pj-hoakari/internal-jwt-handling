version: "2"

linters:
    default: standard
    enable:
        - wsl_v5
        - bodyclose
        - contextcheck
        - fatcontext
        - containedctx
        - exhaustruct
        - exhaustive
        - forbidigo
        - gosec
        - nilnil
        - nilerr
        - nlreturn
    settings:
        errcheck:
            check-type-assertions: true
            check-blank: true
            disable-default-exclusions: true
            exclude-functions:
                - fmt.Print
                - fmt.Printf
                - fmt.Println
        forbidigo:
            forbid:
                # Logging goes through log/slog, so that every record comes out
                # in the structure Cloud Logging parses and carries the trace of
                # its request context.
                - pattern: '^log\.[A-Z]\w*$'
                  msg: "use log/slog (internal/logging) instead of the standard log package"
        exhaustruct:
            exclude:
                - 'crypto/tls\.Config'
                - 'log/slog\.HandlerOptions'
                - 'net/http\.Server'
                - 'net/http\.Client'
                - 'net/http\.Transport'
        wsl_v5:
            allow-first-in-block: true
            allow-whole-block: false
            branch-max-lines: 2
    exclusions:
        rules:
            - path: _test\.go
              linters:
                  - errcheck
                  - exhaustruct
                  - forbidigo
                  - gosec
                  - staticcheck
                  - fatcontext
                  - containedctx

